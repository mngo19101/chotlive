# App THỬ "VTP Nháp Test": tách biệt hoàn toàn với app ChốtLive thật (ios-native/).
# Bundle id riêng nên cài song song, không chung dữ liệu, không chung đăng nhập.
name: VtpNhapTest
options:
  bundleIdPrefix: com.chotlive
  deploymentTarget:
    iOS: "16.0"
targets:
  VtpNhapTest:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VTP Nháp Test
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chotlive.vtpnhaptest
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
