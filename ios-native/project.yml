name: ChotLive
options:
  bundleIdPrefix: com.chotlive
  deploymentTarget:
    iOS: "16.0"
targets:
  ChotLive:
    type: application
    platform: iOS
    sources:
      - ChotLive
    info:
      path: ChotLive/Info.plist
      properties:
        CFBundleDisplayName: ChốtLive
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: Ứng dụng cần Bluetooth để kết nối và in tem qua máy in nhiệt.
        NSBluetoothPeripheralUsageDescription: Ứng dụng cần Bluetooth để kết nối máy in.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chotlive.native
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
