name: Server tests

on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - 'ios-native/**'
      - 'dist/**'
      - '**.md'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Chạy test
        run: npm test
